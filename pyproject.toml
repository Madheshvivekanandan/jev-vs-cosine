[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-vs-cosine"
version = "0.1.0"
description = "Benchmark: TypeSafe Jev vs cosine similarity for intent classification on Banking77."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "typesafe-sdk==0.7.1",          # official client for the Jev API
    "sentence-transformers==6.1.0", # free local embedding model for the cosine methods
    "numpy==2.5.3",                 # vector maths for cosine similarity
    "matplotlib==3.11.2",           # the accuracy-vs-examples chart
    "pydantic-settings==2.15.0",    # typed settings; keeps the API key in a SecretStr
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.8",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pip-audit==2.10.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "UP", "B", "S", "SIM", "C4", "RET", "ARG", "PTH",
          "ASYNC", "ANN", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
# S101: pytest's assert is the assertion mechanism in tests.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = ["error"]
markers = []

[tool.coverage.run]
source = ["app"]
